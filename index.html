<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Pong - Mouse Controlled</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="game-wrapper">
    <!-- Top Header & Scoreboard -->
    <header class="header">
      <div class="title-container">
        <h1 class="logo">NEON PONG</h1>
        <span class="badge">MOUSE CONTROL</span>
      </div>
      <div class="scoreboard">
        <div class="score-card player-card">
          <span class="label">PLAYER</span>
          <span id="player-score" class="score">0</span>
        </div>
        <div class="vs-divider">:</div>
        <div class="score-card cpu-card">
          <span class="label">CPU</span>
          <span id="cpu-score" class="score">0</span>
        </div>
      </div>
    </header>

    <!-- Canvas Container -->
    <div class="canvas-container" id="canvas-container">
      <canvas id="gameCanvas" width="850" height="520"></canvas>
      
      <!-- Overlay Screen (Start / Pause / Win / Loss) -->
      <div id="overlay" class="overlay">
        <div class="overlay-content">
          <h2 id="overlay-title">READY TO PLAY?</h2>
          <p id="overlay-subtitle">Move mouse or swipe finger up & down to steer your paddle.</p>
          <div class="difficulty-picker">
            <span>Difficulty:</span>
            <button class="diff-btn active" data-diff="normal">Normal</button>
            <button class="diff-btn" data-diff="pro">Pro</button>
            <button class="diff-btn" data-diff="impossible">Impossible</button>
          </div>
          <button id="start-btn" class="btn primary-btn">START GAME</button>
          <p class="hint">First to 5 points wins &bull; Press <kbd>Space</kbd> to Pause</p>
        </div>
      </div>
    </div>

    <!-- Footer Controls -->
    <footer class="footer">
      <div class="controls-info">
        <span class="controls-hint">🎮 <strong>Controls:</strong> Mouse / Touch swipe &bull; <kbd>S</kbd> Slo-Mo &bull; <kbd>C</kbd> Curve</span>
        <button id="slomo-btn" class="slomo-toggle active" title="Toggle Slo-Mo (or press S)">⏱️ Slo-Mo: ON</button>
        <button id="curve-btn" class="curve-toggle active" title="Toggle Curve Physics (or press C)">🌀 Curve: ON</button>
        <span>🔊 <button id="mute-btn" class="text-btn">Sound: ON</button></span>
        <button id="fullscreen-btn" class="text-btn" title="Toggle Fullscreen">⛶ Fullscreen</button>
      </div>
      <button id="reset-btn" class="btn secondary-btn">Reset Match</button>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
